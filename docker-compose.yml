services:
  # 1. フロントエンドサービス（React / Vite）
  frontend:
    build: ./frontend
    container_name: docker-dev-test-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # 2. バックエンドサービス（FastAPI）
  backend:
    build: ./backend
    container_name: docker-dev-test-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # FastAPI（SQLAlchemy等）から一発で繋げるように接続URLを定義
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/test-db
    depends_on:
      - db

  # 3. データベースサービス (PostgreSQL)
  db:
    build: ./db
    container_name: docker-dev-test-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test-db